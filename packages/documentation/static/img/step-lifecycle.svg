<svg viewBox="0 0 900 720" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Flow chart of a durable step's lifecycle: check for a saved result and return it if present; otherwise claim a lease; if the prior attempt was ambiguous and a probe exists, run the probe, which returns the saved result when the effect is found or proceeds to run the step function when it is not; if it is ambiguous with no probe the step is parked as needs review; then record the outcome as completed, a terminal failure, ambiguous, or a scheduled retry that loops back to claim after backoff.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626" />
    </marker>
  </defs>

  <!-- ================= Column guide =================
       Left decision column center x = 330
       Right box column center x = 630
       Retry return lane x = 880 (far right, empty)
  -->

  <!-- Start -->
  <rect x="230" y="24" width="200" height="48" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5" />
  <text x="330" y="53" font-size="14" fill="#0f172a" text-anchor="middle">Step reached</text>

  <!-- Decision 1: saved result already exists? -->
  <polygon points="330,104 440,150 330,196 220,150" fill="#f1f5f9" stroke="#475569" stroke-width="1.5" />
  <text x="330" y="146" font-size="13" fill="#0f172a" text-anchor="middle">Saved result</text>
  <text x="330" y="163" font-size="13" fill="#0f172a" text-anchor="middle">already exists?</text>

  <!-- Return saved result -->
  <rect x="530" y="126" width="200" height="48" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
  <text x="630" y="155" font-size="14" fill="#0f172a" text-anchor="middle">Return saved result</text>

  <!-- Claim step -->
  <rect x="230" y="240" width="200" height="48" rx="10" fill="#eef2ff" stroke="#2563eb" stroke-width="1.5" />
  <text x="330" y="269" font-size="14" fill="#0f172a" text-anchor="middle">Claim step (take lease)</text>

  <!-- Decision 2: prior attempt ambiguous? -->
  <polygon points="330,328 440,376 330,424 220,376" fill="#f1f5f9" stroke="#475569" stroke-width="1.5" />
  <text x="330" y="372" font-size="13" fill="#0f172a" text-anchor="middle">Prior attempt</text>
  <text x="330" y="389" font-size="13" fill="#0f172a" text-anchor="middle">ambiguous?</text>

  <!-- Probe -->
  <rect x="530" y="352" width="200" height="48" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5" />
  <text x="630" y="381" font-size="14" fill="#0f172a" text-anchor="middle">Run probe()</text>

  <!-- Run step function -->
  <rect x="230" y="480" width="200" height="48" rx="10" fill="#eef2ff" stroke="#2563eb" stroke-width="1.5" />
  <text x="330" y="509" font-size="14" fill="#0f172a" text-anchor="middle">Run step function</text>

  <!-- ================= Outcome row (y = 616) ================= -->
  <rect x="20" y="616" width="146" height="52" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
  <text x="93" y="647" font-size="13" fill="#0f172a" text-anchor="middle">COMPLETED</text>

  <rect x="186" y="616" width="168" height="52" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" />
  <text x="270" y="639" font-size="13" fill="#0f172a" text-anchor="middle">FAILED /</text>
  <text x="270" y="656" font-size="13" fill="#0f172a" text-anchor="middle">FAILED_OPTIONAL</text>

  <rect x="374" y="616" width="140" height="52" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5" />
  <text x="444" y="647" font-size="13" fill="#0f172a" text-anchor="middle">AMBIGUOUS</text>

  <rect x="534" y="616" width="150" height="52" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" />
  <text x="609" y="639" font-size="12" fill="#0f172a" text-anchor="middle">NEEDS_REVIEW</text>
  <text x="609" y="655" font-size="11" fill="#7f1d1d" text-anchor="middle">(parked)</text>

  <rect x="704" y="616" width="176" height="52" rx="10" fill="#eef2ff" stroke="#2563eb" stroke-width="1.5" />
  <text x="792" y="639" font-size="13" fill="#0f172a" text-anchor="middle">Retry scheduled</text>
  <text x="792" y="655" font-size="11" fill="#1e3a8a" text-anchor="middle">waits, then re-claims</text>

  <!-- ================= Edges ================= -->

  <!-- start -> decision1 -->
  <path d="M 330 72 L 330 102" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

  <!-- decision1 -> return saved (yes) -->
  <path d="M 440 150 L 528 150" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <text x="484" y="141" font-size="12" fill="#475569" text-anchor="middle">yes</text>

  <!-- decision1 -> claim (no) -->
  <path d="M 330 196 L 330 238" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <text x="346" y="221" font-size="12" fill="#475569" text-anchor="middle">no</text>

  <!-- claim -> decision2 -->
  <path d="M 330 288 L 330 326" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

  <!-- decision2 -> probe (yes, has probe) -->
  <path d="M 440 376 L 528 376" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <text x="484" y="367" font-size="12" fill="#475569" text-anchor="middle">yes</text>

  <!-- decision2 -> run (no) -->
  <path d="M 330 424 L 330 478" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <text x="346" y="453" font-size="12" fill="#475569" text-anchor="middle">no</text>

  <!-- probe FOUND -> return saved result (up along x=470 lane, into bottom of Return box) -->
  <path d="M 570 352 L 570 174" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#arrow-green)" />
  <text x="486" y="330" font-size="12" fill="#15803d" text-anchor="middle">found: return saved</text>

  <!-- probe NOT FOUND -> run step function (down then left into right edge of Run) -->
  <path d="M 660 400 L 660 504 L 432 504" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <text x="600" y="496" font-size="12" fill="#475569" text-anchor="middle">not found: run</text>

  <!-- probe NO-PROBE case handled from the run outcome AMBIGUOUS? No: parked directly.
       Show: when ambiguous but there is no probe, the step is parked. Drawn as a
       dashed edge from the "yes" branch area down to NEEDS_REVIEW. -->
  <path d="M 420 388 L 470 420 L 470 590 L 560 590 L 560 614" stroke="#dc2626" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow-red)" />
  <text x="500" y="440" font-size="11" fill="#b91c1c" text-anchor="middle">no probe</text>

  <!-- run -> COMPLETED (success) -->
  <path d="M 288 528 L 120 614" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <text x="188" y="556" font-size="12" fill="#475569" text-anchor="middle">success</text>

  <!-- run -> FAILED (fatal) -->
  <path d="M 318 528 L 282 614" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <text x="284" y="568" font-size="12" fill="#475569" text-anchor="middle">fatal</text>

  <!-- run -> AMBIGUOUS (timeout/5xx) -->
  <path d="M 372 528 L 430 614" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <text x="436" y="568" font-size="12" fill="#475569" text-anchor="middle">timeout/5xx</text>

  <!-- run -> Retry scheduled (retryable) -->
  <path d="M 430 512 L 704 612" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <text x="600" y="548" font-size="12" fill="#475569" text-anchor="middle">retryable</text>

  <!-- retry -> claim (loops back along far-right lane x=880 to the right edge of Claim) -->
  <path d="M 880 616 L 880 264 L 432 264" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <text x="880" y="440" font-size="12" fill="#475569" text-anchor="middle" transform="rotate(90 880 440)">after backoff</text>
</svg>
